# Perfil de test: H2 en memoria, para que la suite no dependa de un MySQL levantado.
# Solo sobrescribe lo necesario; el resto se hereda de src/main/resources/application.properties.
spring.datasource.url=jdbc:h2:mem:pruebadispapeles;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# En MySQL el esquema es fijo y se valida; aquí lo crea Hibernate a partir de las entidades.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

logging.level.org.hibernate.SQL=INFO
